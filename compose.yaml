services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite
      SERA_NETWORK: sepolia
      ENABLE_MAINNET: "false"
      ENABLE_TESTNET_EXECUTION: "false"
    volumes:
      - bot-data:/app/data
    stop_grace_period: 30s
volumes:
  bot-data:
